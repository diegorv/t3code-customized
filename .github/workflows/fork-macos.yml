name: Fork macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          security cms -D -i "$T3CODE_MACOS_PROVISIONING_PROFILE" >/dev/null
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 --signed --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-macos-arm64
          path: release/*.dmg
          if-no-files-found: error
