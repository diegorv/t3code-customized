name: Fork release

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    tags: ["fork-v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Stable version (e.g. 1.2.3). Defaults to apps/desktop/package.json.
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/desktop/package.json
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(jq -r .version apps/desktop/package.json)"
          skip=false
          if [[ "$EVENT" == "push" ]]; then
            version="${REF_NAME#fork-v}"
          elif [[ "$EVENT" == "workflow_dispatch" && "$INPUT_CHANNEL" == "stable" ]]; then
            version="${INPUT_VERSION:-$base}"
          else
            version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            last="$(gh release list -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))][0].tagName // ""')"
            if [[ "$EVENT" == "schedule" && -n "$last" ]]; then
              last_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$last" --jq .sha)"
              [[ "$last_sha" == "$GITHUB_SHA" ]] && skip=true
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]{8}\.[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Version $version (skip=$skip)"

  ci:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/fork-ci.yml

  build:
    name: Build signed macOS arm64
    needs: [prepare, ci]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          security cms -D -i "$T3CODE_MACOS_PROVISIONING_PROFILE" >/dev/null
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "$VERSION" --signed --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-mac-arm64
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          flags=(--latest)
          [[ "$VERSION" == *-nightly.* ]] && flags=(--prerelease --latest=false)
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "T3 Code $VERSION" --generate-notes "${flags[@]}"
