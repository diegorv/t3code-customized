name: Fork CI

on:
  pull_request:
  push:
    branches: [fork]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run knip:check
      - run: vp check
      - run: vp run typecheck

  test:
    name: Test packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # The desktop tests compile the browser secret helper.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  # Shard so free 4-vCPU runners do not starve the long browser PDF tests.
  test-web:
    name: Test web ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - working-directory: apps/web
        run: vp test run --passWithNoTests --project unit --project browser --shard=${{ matrix.shard }}/3
      - name: Boot the built web client
        if: matrix.shard == 1
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  # Server test files run one at a time (fileParallelism: false), so shard across runners.
  test-server:
    name: Test server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - working-directory: apps/server
        run: vp test run --shard=${{ matrix.shard }}/4
